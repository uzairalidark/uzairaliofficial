<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Dark Crypto</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0E14;--surface:#12161F;--surface-2:#161B26;--line:#232935;--gold:#D4A73A;--green:#3FA76B;--red:#C9483D;--ink:#E8E6DF;--muted:#7A8290;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:48px 20px 60px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
  .back{font-size:13px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:24px;}
  label{font-size:12px;color:var(--muted);display:block;margin:14px 0 6px;}
  input,textarea{
    width:100%;padding:11px 12px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;
  }
  textarea{min-height:110px;resize:vertical;font-family:'Inter',sans-serif;}
  button{
    margin-top:18px;width:100%;padding:12px;border:none;border-radius:8px;
    background:var(--gold);color:#0B0E14;font-weight:600;font-size:14px;cursor:pointer;
  }
  button:hover{opacity:0.9;}
  button.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:8px;display:none;}
  .msg.ok{display:block;background:rgba(63,167,107,0.1);color:var(--green);border:1px solid rgba(63,167,107,0.3);}
  .msg.err{display:block;background:rgba(201,72,61,0.1);color:var(--red);border:1px solid rgba(201,72,61,0.3);}
  #loginBox, #panelBox{display:none;}
  .post-item{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;margin-top:10px;font-size:13px;
  }
  .post-item .pdate{color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .post-item .ptitle{font-weight:600;margin:4px 0;}
  .post-item .pbody{color:var(--muted);font-size:12.5px;}
  .post-item .del{color:var(--red);font-size:11px;cursor:pointer;margin-top:6px;display:inline-block;}
  .section-title{font-family:'Space Grotesk',sans-serif;font-size:14px;margin:30px 0 4px;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;}
  .logout{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Back to hub</a>

  <div id="loginBox">
    <h1>Admin Login</h1>
    <div class="sub">Only the authorized email can publish posts.</div>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="••••••••">
    <button onclick="doLogin()">Log In</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panelBox">
    <div class="top-bar">
      <h1>Publish Update</h1>
      <span class="logout" onclick="doLogout()">Log out</span>
    </div>
    <div class="sub">This goes live on the site immediately — no file editing needed.</div>

    <label>Title</label>
    <input type="text" id="postTitle" placeholder="e.g. BTC breaks key resistance">
    <label>Content</label>
    <textarea id="postBody" placeholder="Write your real update here..."></textarea>
    <label>Tag (optional)</label>
    <input type="text" id="postTag" placeholder="e.g. BTC, MARKET, ALERT">
    <label>Link (optional)</label>
    <input type="text" id="postLink" placeholder="https://... (e.g. video, article, product)">
    <label>Telegram Voice Message Link (optional)</label>
    <input type="text" id="postVoice" placeholder="e.g. t.me/yourchannel/123">
    <button onclick="publishPost()">Publish to Website</button>
    <div class="msg" id="publishMsg"></div>

    <div class="section-title">Recent Posts</div>
    <div id="postsList"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig, ADMIN_EMAIL } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const POSTS_DOC = doc(db, "site", "posts"); // single document — keeps Firestore reads to 1 per page load

  window.doLogin = async function(){
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const msg = document.getElementById('loginMsg');
    try{
      await signInWithEmailAndPassword(auth, email, pass);
    }catch(e){
      msg.className = 'msg err';
      msg.textContent = 'Login failed — check email/password.';
    }
  };

  window.doLogout = function(){ signOut(auth); };

  onAuthStateChanged(auth, (user) => {
    const loginBox = document.getElementById('loginBox');
    const panelBox = document.getElementById('panelBox');
    if(user && user.email === ADMIN_EMAIL){
      loginBox.style.display = 'none';
      panelBox.style.display = 'block';
      loadPostsIntoPanel();
    }else{
      if(user) { // logged in but wrong email
        document.getElementById('loginMsg').className = 'msg err';
        document.getElementById('loginMsg').textContent = 'This account is not authorized.';
        signOut(auth);
      }
      loginBox.style.display = 'block';
      panelBox.style.display = 'none';
    }
  });

  async function getCurrentPosts(){
    const snap = await getDoc(POSTS_DOC);
    if(snap.exists() && Array.isArray(snap.data().posts)) return snap.data().posts;
    return [];
  }

  window.publishPost = async function(){
    const title = document.getElementById('postTitle').value.trim();
    const body = document.getElementById('postBody').value.trim();
    const tag = document.getElementById('postTag').value.trim();
    const link = document.getElementById('postLink').value.trim();
    const voice = document.getElementById('postVoice').value.trim();
    const msg = document.getElementById('publishMsg');
    if(!title || !body){
      msg.className = 'msg err'; msg.textContent = 'Title and content are required.'; return;
    }
    try{
      const posts = await getCurrentPosts();
      const newPost = {
        date: new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }),
        title, body, tag: tag || null,
        link: link || null,
        voice: voice ? voice.replace(/^https?:\/\/(t\.me\/|telegram\.me\/)/i, '') : null
      };
      posts.unshift(newPost);
      await setDoc(POSTS_DOC, { posts: posts.slice(0, 100) }); // keep last 100 max
      msg.className = 'msg ok'; msg.textContent = 'Published! Live on the site now.';
      document.getElementById('postTitle').value = '';
      document.getElementById('postBody').value = '';
      document.getElementById('postTag').value = '';
      document.getElementById('postLink').value = '';
      document.getElementById('postVoice').value = '';
      loadPostsIntoPanel();
    }catch(e){
      msg.className = 'msg err'; msg.textContent = 'Failed to publish: ' + e.message;
    }
  };

  window.deletePost = async function(index){
    const posts = await getCurrentPosts();
    posts.splice(index, 1);
    await setDoc(POSTS_DOC, { posts });
    loadPostsIntoPanel();
  };

  async function loadPostsIntoPanel(){
    const posts = await getCurrentPosts();
    document.getElementById('postsList').innerHTML = posts.map((p, i) => `
      <div class="post-item">
        <div class="pdate">${p.date}</div>
        <div class="ptitle">${p.title}</div>
        <div class="pbody">${p.body}</div>
        <span class="del" onclick="deletePost(${i})">Delete</span>
      </div>
    `).join('') || '<div class="sub">No posts yet.</div>';
  }
</script>
</body>
</html>
